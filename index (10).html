<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Revue · Presse quotidienne ENS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1a1a;
      --ink-faint: #6b6b6b;
      --ink-faintest: #c8c8c8;
      --paper: #f8f6f1;
      --paper-warm: #f0ede6;
      --rule: #d4cfc6;
      --accent-en: #1d4e8a;
      --accent-es: #b5240e;
      --accent-fr: #2a6b3f;
      --tag-bg-en: #e8f0f9;
      --tag-bg-es: #faeae8;
      --tag-bg-fr: #e8f2ec;
      --reading-time: #7a6f5e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 18px;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── MASTHEAD ── */
    .masthead {
      border-bottom: 3px double var(--ink);
      padding: 28px 0 16px;
      text-align: center;
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .masthead-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 6px;
    }
    .masthead-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .masthead-sub {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--ink-faint);
      margin-top: 6px;
    }
    .masthead-date {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      margin-top: 10px;
    }

    /* ── LAYOUT ── */
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }

    /* ── CONFIG PANEL ── */
    .config-section {
      padding: 36px 0 24px;
      border-bottom: 1px solid var(--rule);
    }
    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    .config-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    .config-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .config-select, .config-input {
      font-family: 'Crimson Pro', serif;
      font-size: 16px;
      padding: 8px 12px;
      border: 1px solid var(--rule);
      border-radius: 0;
      background: var(--paper-warm);
      color: var(--ink);
      appearance: none;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .config-select:focus, .config-input:focus { border-color: var(--ink); }

    .lang-toggles { display: flex; gap: 8px; }
    .lang-btn {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      padding: 7px 16px;
      border: 1px solid var(--rule);
      background: var(--paper-warm);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .lang-btn.active-en { background: var(--accent-en); color: #fff; border-color: var(--accent-en); }
    .lang-btn.active-es { background: var(--accent-es); color: #fff; border-color: var(--accent-es); }
    .lang-btn.active-fr { background: var(--accent-fr); color: #fff; border-color: var(--accent-fr); }

    .generate-btn {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-style: italic;
      padding: 13px 32px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .generate-btn:hover { background: #333; }
    .generate-btn:disabled { background: var(--ink-faintest); cursor: not-allowed; }

    /* ── PROGRESS BAR ── */
    .progress-strip {
      height: 3px;
      background: var(--rule);
      margin-top: 20px;
      display: none;
      overflow: hidden;
    }
    .progress-strip.visible { display: block; }
    .progress-fill {
      height: 100%;
      background: var(--ink);
      width: 0%;
      transition: width 0.4s ease;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 60%; }
      100% { transform: translateX(200%); width: 60%; }
    }

    /* ── STATUS ── */
    .status-bar {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.05em;
      margin-top: 12px;
      min-height: 18px;
      font-style: italic;
    }

    /* ── DIGEST ── */
    .digest-section { padding: 40px 0; }

    .digest-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 10px;
      margin-bottom: 36px;
    }
    .digest-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 400;
    }
    .digest-meta {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--reading-time);
      letter-spacing: 0.08em;
    }

    /* ── ARTICLE CARD ── */
    .article-card {
      margin-bottom: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--rule);
    }
    .article-card:last-child { border-bottom: none; }

    .article-top {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .article-lang-tag {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 4px 10px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .lang-en { background: var(--tag-bg-en); color: var(--accent-en); }
    .lang-es { background: var(--tag-bg-es); color: var(--accent-es); }
    .lang-fr { background: var(--tag-bg-fr); color: var(--accent-fr); }

    .article-source {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .article-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 2.5vw, 1.75rem);
      font-weight: 600;
      line-height: 1.25;
      flex: 1;
    }
    .article-summary {
      font-size: 18px;
      line-height: 1.75;
      color: #2a2a2a;
      margin-bottom: 24px;
    }
    .article-original {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--ink-faint);
      border-left: 2px solid var(--rule);
      padding-left: 16px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    /* ── VOCAB BLOCK ── */
    .vocab-block {
      background: var(--paper-warm);
      border: 1px solid var(--rule);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .vocab-title {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 12px;
    }
    .vocab-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .vocab-item {
      font-size: 15px;
    }
    .vocab-word { font-weight: 600; }
    .vocab-def { color: var(--ink-faint); font-style: italic; }

    /* ── QUESTION BLOCK ── */
    .question-block {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-top: 4px;
    }
    .question-mark {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-style: italic;
      color: var(--ink-faintest);
      line-height: 1;
      flex-shrink: 0;
      margin-top: -4px;
    }
    .question-text {
      font-style: italic;
      color: var(--ink-faint);
      font-size: 17px;
      line-height: 1.5;
    }

    /* ── EMPTY / ERROR ── */
    .empty-state {
      text-align: center;
      padding: 80px 0;
      color: var(--ink-faint);
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .empty-state-text {
      font-style: italic;
      font-size: 20px;
    }

    /* ── FOOTER ── */
    .footer {
      border-top: 3px double var(--ink);
      padding: 24px 0;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--ink-faintest);
      letter-spacing: 0.1em;
    }

    @media (max-width: 600px) {
      .config-row { flex-direction: column; }
      .masthead { padding: 20px 0 12px; }
    }
  </style>
</head>
<body>

<!-- MASTHEAD -->
<header class="masthead">
  <div class="masthead-eyebrow">Préparation ENS · Lettres & Sciences</div>
  <div class="masthead-title">La Revue</div>
  <div class="masthead-sub">Votre tour de presse quotidien, en 15 minutes</div>
  <div class="masthead-date" id="dateDisplay"></div>
</header>

<main class="container">

  <!-- CONFIG -->
  <section class="config-section">
    <div class="config-row">
      <div class="config-group">
        <span class="config-label">Langues</span>
        <div class="lang-toggles">
          <button class="lang-btn active-en" data-lang="en" onclick="toggleLang(this)">EN</button>
          <button class="lang-btn active-es" data-lang="es" onclick="toggleLang(this)">ES</button>
          <button class="lang-btn active-fr" data-lang="fr" onclick="toggleLang(this)">FR</button>
        </div>
      </div>
      <div class="config-group">
        <span class="config-label">Thème du jour</span>
        <select class="config-select" id="themeSelect">
          <option value="libre">Libre (actualité générale)</option>
          <option value="geopolitique">Géopolitique & Relations internationales</option>
          <option value="economie">Économie & Finance mondiale</option>
          <option value="culture">Culture & Société</option>
          <option value="sciences">Sciences & Technologie</option>
          <option value="environnement">Environnement & Climat</option>
          <option value="philosophie">Philosophie & Idées</option>
        </select>
      </div>
      <div class="config-group">
        <span class="config-label">Durée de lecture</span>
        <select class="config-select" id="durationSelect">
          <option value="10">~10 minutes (3 articles)</option>
          <option value="15" selected>~15 minutes (4 articles)</option>
          <option value="20">~20 minutes (5–6 articles)</option>
        </select>
      </div>
      <button class="generate-btn" id="generateBtn" onclick="generateDigest()">
        Générer ma revue →
      </button>
    </div>
    <div class="progress-strip" id="progressStrip">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </section>

  <!-- DIGEST OUTPUT -->
  <section class="digest-section" id="digestSection">
    <div class="empty-state">
      <div class="empty-state-icon">◆</div>
      <div class="empty-state-text">Configurez vos préférences et cliquez sur <em>Générer</em> pour commencer.</div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container">
    La Revue · Outil de préparation ENS · Propulsé par Claude
  </div>
</footer>

<script>
// ── STATE ──
const activeLangs = new Set(['en', 'es', 'fr']);

// ── DATE ──
const now = new Date();
document.getElementById('dateDisplay').textContent =
  now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

// ── LANG TOGGLE ──
function toggleLang(btn) {
  const lang = btn.dataset.lang;
  if (activeLangs.has(lang)) {
    if (activeLangs.size === 1) return; // keep at least one
    activeLangs.delete(lang);
    btn.classList.remove(`active-${lang}`);
  } else {
    activeLangs.add(lang);
    btn.classList.add(`active-${lang}`);
  }
}

// ── SOURCES per lang ──
const SOURCES = {
  en: ['The Economist', 'The Guardian', 'BBC News', 'Financial Times', 'The New York Times'],
  es: ['El País', 'El Mundo', 'La Vanguardia', 'El Confidencial', 'ABC'],
  fr: ['Le Monde', 'Le Figaro', 'Libération', 'Les Echos', 'Le Point'],
};

// ── GENERATE ──
async function generateDigest() {
  const btn = document.getElementById('generateBtn');
  const progress = document.getElementById('progressStrip');
  const status = document.getElementById('statusBar');
  const section = document.getElementById('digestSection');
  const theme = document.getElementById('themeSelect').value;
  const duration = document.getElementById('durationSelect').value;
  const langs = [...activeLangs];

  if (langs.length === 0) { status.textContent = 'Sélectionnez au moins une langue.'; return; }

  btn.disabled = true;
  progress.classList.add('visible');
  status.textContent = 'Connexion à Claude…';
  section.innerHTML = '';

  const nbArticles = duration === '10' ? 3 : duration === '15' ? 4 : 6;
  const themeLabel = document.getElementById('themeSelect').selectedOptions[0].text;

  // Build source list for prompt
  const sourceList = langs.flatMap(l => SOURCES[l].slice(0, 2)).join(', ');

  const systemPrompt = `Tu es un agrégateur de presse expert, spécialisé dans la préparation aux concours ENS (hypokhâgne/khâgne). 
Tu crées des revues de presse synthétiques, analytiques et pédagogiques.
Tu réponds UNIQUEMENT en JSON valide, sans aucun texte avant ou après, sans balises Markdown.`;

  const userPrompt = `Génère une revue de presse du ${now.toLocaleDateString('fr-FR')} avec exactement ${nbArticles} articles.
Langues à inclure (répartis équitablement) : ${langs.join(', ')}.
Thème principal : ${themeLabel}.
Sources à utiliser (invente des articles plausibles et récents) : ${sourceList}.
Durée cible : ${duration} minutes de lecture.

Pour chaque article, génère un contenu réaliste et éducatif comme s'il venait vraiment de cette source.

Réponds avec ce JSON exact (tableau d'objets) :
[
  {
    "lang": "en" | "es" | "fr",
    "source": "Nom de la source",
    "title": "Titre de l'article (dans la langue originale)",
    "summary_fr": "Résumé en français de 4-6 phrases, analytique et dense, niveau hypokhâgne.",
    "excerpt_original": "Extrait fictif de 2-3 phrases dans la langue originale, style éditorial de la source.",
    "vocab": [
      {"word": "mot", "def": "définition courte en français"}
    ],
    "question": "Une question de réflexion pour entraîner à l'oral ENS, en français."
  }
]

Contraintes :
- vocab : 3-5 mots par article (termes spécialisés, idiomes, faux-amis selon la langue)
- Les résumés doivent être analytiques, pas descriptifs : montrer les enjeux, les causes, les conséquences
- Les titres et extraits en langue originale doivent sonner authentiques (style The Economist pour EN, style El País pour ES, etc.)
- Pour FR : inclure au moins 1 article si FR est sélectionné
- Répartis les langues sur les ${nbArticles} articles`;

  try {
    status.textContent = 'Claude rédige votre revue…';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });

    if (!response.ok) throw new Error(`API error ${response.status}`);
    const data = await response.json();

    status.textContent = 'Mise en page…';

    const raw = data.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const articles = JSON.parse(clean);

    renderDigest(articles, duration, langs);

    progress.classList.remove('visible');
    status.textContent = `✓ Revue du ${now.toLocaleDateString('fr-FR')} générée — bonne lecture !`;

  } catch (err) {
    console.error(err);
    progress.classList.remove('visible');
    status.textContent = `Erreur : ${err.message}`;
    section.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠</div><div class="empty-state-text">${err.message}</div></div>`;
  } finally {
    btn.disabled = false;
  }
}

// ── RENDER ──
function renderDigest(articles, duration, langs) {
  const section = document.getElementById('digestSection');
  const totalWords = articles.reduce((acc, a) => acc + (a.summary_fr || '').split(' ').length, 0);
  const readMin = Math.round(totalWords / 200);

  const langLabels = { en: 'English', es: 'Español', fr: 'Français' };

  section.innerHTML = `
    <div class="digest-header">
      <span class="digest-heading">Revue du ${new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}</span>
      <span class="digest-meta">≈ ${readMin}–${readMin + 3} min · ${articles.length} articles · ${langs.map(l => langLabels[l]).join(', ')}</span>
    </div>
    ${articles.map(renderArticle).join('')}
  `;
}

function renderArticle(a) {
  const vocabHtml = (a.vocab || []).map(v =>
    `<span class="vocab-item"><span class="vocab-word">${v.word}</span> <span class="vocab-def">— ${v.def}</span></span>`
  ).join('');

  return `
    <article class="article-card">
      <div class="article-top">
        <span class="article-lang-tag lang-${a.lang}">${a.lang.toUpperCase()}</span>
        <div style="flex:1">
          <div class="article-source">${a.source || ''}</div>
          <h2 class="article-title">${a.title || ''}</h2>
        </div>
      </div>

      <p class="article-summary">${a.summary_fr || ''}</p>

      ${a.excerpt_original ? `<blockquote class="article-original">"${a.excerpt_original}"</blockquote>` : ''}

      ${vocabHtml ? `
      <div class="vocab-block">
        <div class="vocab-title">Vocabulaire à retenir</div>
        <div class="vocab-list">${vocabHtml}</div>
      </div>` : ''}

      ${a.question ? `
      <div class="question-block">
        <span class="question-mark">?</span>
        <p class="question-text">${a.question}</p>
      </div>` : ''}
    </article>
  `;
}
</script>
</body>
</html>
